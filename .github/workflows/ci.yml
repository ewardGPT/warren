name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-

      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:agents
      - run: bun run check:size
      - run: bun run check:debt
      - run: bun run check:dups
      - run: bun run check:ci-parity
      - run: bun run ui:install
      - run: bun run check:deps
      - run: bun run build:ui
      - run: bun run check:bundle-size
      - name: Run tests with coverage + JUnit reporter
        run: bun run check:coverage:ci

      - name: Test timing summary
        if: always()
        run: bun run report:test-timing

      - name: Code-quality metrics summary
        if: always()
        run: bun run report:quality-metrics

      - name: Upload test timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-junit
          path: test-results/junit.xml
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  coverage-gate:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          path: warren

      - uses: actions/checkout@v6.0.2
        with:
          repository: mudrii/eval-harness
          token: ${{ secrets.GITHUB_TOKEN }}
          path: eval-harness

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install eval-harness
        working-directory: eval-harness
        run: pip install -e .

      - name: Emit coverage evidence from JUnit
        working-directory: eval-harness
        run: |
          JUNIT_PATH="../warren/test-results/junit.xml"
          if [ -f "$JUNIT_PATH" ]; then
            python3 -c "
            import sys; sys.path.insert(0, '.')
            from eval_harness.runners.warren_runner import emit_evidence_from_junit, get_test_suite_results_from_xml
            from pathlib import Path
            xml = Path('$JUNIT_PATH').read_bytes()
            suites = get_test_suite_results_from_xml(xml)
            total = sum(s['tests'] for s in suites)
            records = emit_evidence_from_junit(xml, Path('../warren'))
            print(f'{len(records)} evidence record(s) for warren ({total} tests parsed)')
            "
          else
            echo "No JUnit file found"
          fi

      - name: Run coverage gate
        working-directory: eval-harness
        continue-on-error: true
        run: |
          echo "=== Coverage Gate: warren ==="
          evalh coverage gate --profile pull_request --project warren 2>&1
