# .warren/config.yaml — per-project warren defaults.
defaultRole: sapling
defaultBranch: main
# Sapling runs through Burrow's OpenAI-compatible backend. Keep the project
# default aligned with the backend names Burrow accepts; Pi/OpenRouter is not
# an implementation path for Warren Seeds.
defaultProvider: openai
defaultModel: deepseek-chat
runBranchPrefix: warren
qualityGate: bun run check:all
